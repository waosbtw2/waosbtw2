<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120709"/>
      <stop offset=".65" stop-color="#2d0b11"/>
      <stop offset="1" stop-color="#6a0d15"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#f1e6cc" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#d8ccb6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d8ccb6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#c0202c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c0202c" stop-opacity="0"/>
    </radialGradient>
    <path id="bat" d="M32 10c2 0 3 2 4 4 3-5 8-9 15-9-2 3-3 6-3 9 4-1 8-1 12 1-5 1-8 4-10 8-2-2-5-3-8-2-1 3-4 6-10 8-6-2-9-5-10-8-3-1-6 0-8 2-2-4-5-7-10-8 4-2 8-2 12-1 0-3-1-6-3-9 7 0 12 4 15 9 1-2 2-4 4-4z"/>
    <path id="win" d="M-6 0 V-30 Q0 -46 6 -30 V0z"/>
  </defs>

  <rect width="900" height="220" fill="url(#sky)"/>
  <ellipse cx="450" cy="190" rx="420" ry="90" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#e8dcc0">
    <circle cx="60" cy="30" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="70" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="25" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="45" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="20" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="55" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="28" r="1"><animate attributeName="opacity" values="1;.4;1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="110" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="770" cy="75" r="70" fill="url(#moon)"/>
  <circle cx="770" cy="75" r="26" fill="#e8dcc0"/>
  <circle cx="762" cy="68" r="5" fill="#cbbd9c"/>
  <circle cx="779" cy="84" r="3.5" fill="#cbbd9c"/>
  <circle cx="776" cy="64" r="2.5" fill="#cbbd9c"/>

  <!-- cathedral silhouette -->
  <g fill="#000">
    <!-- far spires -->
    <rect x="170" y="150" width="20" height="40"/>
    <polygon points="166,152 180,124 194,152"/>
    <rect x="179" y="110" width="2" height="14"/><rect x="175" y="115" width="10" height="2"/>
    <rect x="830" y="150" width="20" height="40"/>
    <polygon points="826,152 840,124 854,152"/>
    <rect x="839" y="110" width="2" height="14"/><rect x="835" y="115" width="10" height="2"/>
    <!-- outer spires -->
    <rect x="255" y="130" width="30" height="60"/>
    <polygon points="251,132 270,92 289,132"/>
    <rect x="268.5" y="72" width="3" height="20"/><rect x="264" y="77" width="12" height="2.5"/>
    <rect x="615" y="130" width="30" height="60"/>
    <polygon points="611,132 630,92 649,132"/>
    <rect x="628.5" y="72" width="3" height="20"/><rect x="624" y="77" width="12" height="2.5"/>
    <!-- naves -->
    <rect x="370" y="125" width="50" height="65"/>
    <polygon points="366,127 395,106 424,127"/>
    <rect x="480" y="125" width="50" height="65"/>
    <polygon points="476,127 505,106 534,127"/>
    <!-- side towers -->
    <rect x="330" y="100" width="40" height="90"/>
    <polygon points="326,102 350,58 374,102"/>
    <rect x="348.5" y="34" width="3" height="24"/><rect x="343" y="40" width="14" height="3"/>
    <rect x="530" y="100" width="40" height="90"/>
    <polygon points="526,102 550,58 574,102"/>
    <rect x="548.5" y="34" width="3" height="24"/><rect x="543" y="40" width="14" height="3"/>
    <!-- central tower -->
    <rect x="420" y="70" width="60" height="120"/>
    <polygon points="416,72 450,22 484,72"/>
    <rect x="448" y="0" width="4" height="24"/><rect x="441" y="7" width="18" height="3.5"/>
    <!-- buttress points -->
    <polygon points="318,190 330,130 330,190"/><polygon points="582,190 570,130 570,190"/>
    <!-- ground -->
    <path d="M0 176 Q 150 168 300 176 T 600 176 T 900 174 V220 H0z"/>
  </g>

  <!-- glowing windows -->
  <g fill="#d2262f">
    <use href="#win" x="450" y="170" transform="translate(0 0)"><animate attributeName="opacity" values=".6;1;.7;1;.55" dur="4s" repeatCount="indefinite"/></use>
    <use href="#win" x="350" y="170" transform="scale(1 .75) translate(0 56)"><animate attributeName="opacity" values="1;.6;1;.8;1" dur="5s" repeatCount="indefinite"/></use>
    <use href="#win" x="550" y="170" transform="scale(1 .75) translate(0 56)"><animate attributeName="opacity" values=".7;1;.6;1;.8" dur="4.5s" repeatCount="indefinite"/></use>
    <circle cx="450" cy="92" r="7" stroke="#c09a45" stroke-width="1"><animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- grave crosses -->
  <g fill="#000">
    <rect x="40" y="150" width="3" height="24"/><rect x="33" y="157" width="17" height="3"/>
    <rect x="100" y="158" width="3" height="18"/><rect x="95" y="163" width="13" height="2.5"/>
    <path d="M205 176 v-18 q0 -9 9 -9 q9 0 9 9 v18z"/>
    <rect x="690" y="152" width="3" height="24"/><rect x="683" y="159" width="17" height="3"/>
    <path d="M735 176 v-16 q0 -8 8 -8 q8 0 8 8 v16z"/>
    <rect x="870" y="156" width="3" height="20"/><rect x="864" y="162" width="15" height="2.5"/>
  </g>

  <!-- bats -->
  <g fill="#000" stroke="#7a1019" stroke-width="1.2">
    <g>
      <animateMotion dur="18s" repeatCount="indefinite" path="M-40 95 C150 20 300 120 450 65 S800 20 940 80"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".5s" repeatCount="indefinite"/>
        <g transform="scale(.55) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
    <g>
      <animateMotion dur="25s" begin="-7s" repeatCount="indefinite" path="M940 135 C700 80 500 150 300 105 S0 70 -40 125"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".6s" repeatCount="indefinite"/>
        <g transform="scale(.4) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
    <g>
      <animateMotion dur="31s" begin="-14s" repeatCount="indefinite" path="M-40 40 C200 85 400 10 600 50 S850 95 940 30"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".45s" repeatCount="indefinite"/>
        <g transform="scale(.7) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
