<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="900" height="50" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0708"/>
      <stop offset=".6" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#6a0d15"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#f1e6cc" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#d8ccb6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#d8ccb6" stop-opacity="0"/>
    </radialGradient>
    <path id="bat" d="M32 10c2 0 3 2 4 4 3-5 8-9 15-9-2 3-3 6-3 9 4-1 8-1 12 1-5 1-8 4-10 8-2-2-5-3-8-2-1 3-4 6-10 8-6-2-9-5-10-8-3-1-6 0-8 2-2-4-5-7-10-8 4-2 8-2 12-1 0-3-1-6-3-9 7 0 12 4 15 9 1-2 2-4 4-4z"/>
    <path id="stone" d="M-7 0 v-13 q0 -8 7 -8 q7 0 7 8 v13z"/>
    <g id="cross"><rect x="-1.2" y="-16" width="2.4" height="16"/><rect x="-5" y="-12" width="10" height="2.4"/></g>
    <g id="chapel">
      <rect x="-11" y="-22" width="22" height="22"/>
      <polygon points="-13,-21 0,-38 13,-21"/>
      <rect x="-0.8" y="-48" width="1.6" height="11"/><rect x="-4" y="-44.5" width="8" height="1.6"/>
    </g>
  </defs>

  <rect width="900" height="50" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e8dcc0">
    <circle cx="90" cy="8" r=".8"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="6" r=".7"><animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="9" r=".8"><animate attributeName="opacity" values="1;.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="5" r=".7"><animate attributeName="opacity" values=".4;1;.4" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="10" r=".7"><animate attributeName="opacity" values="1;.3;1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="770" cy="16" r="22" fill="url(#moon)"/>
  <circle cx="770" cy="16" r="8" fill="#e8dcc0"/>
  <circle cx="767" cy="14" r="1.6" fill="#cbbd9c"/><circle cx="773" cy="19" r="1.1" fill="#cbbd9c"/>

  <!-- dead trees -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round">
    <path d="M40 50 V22 M40 34 L28 26 M40 30 L52 18 M40 22 L34 12 M28 26 L22 21 M52 18 L60 14 M34 12 L30 8"/>
    <path d="M225 50 V28 M225 38 L216 31 M225 33 L234 25 M225 28 L221 19 M234 25 L240 22"/>
    <path d="M860 50 V20 M860 34 L848 25 M860 29 L872 17 M860 22 L854 11 M848 25 L842 20 M872 17 L880 13"/>
  </g>

  <!-- chapels -->
  <g fill="#000">
    <use href="#chapel" x="352" y="50"/>
    <use href="#chapel" x="548" y="50"/>
  </g>
  <g fill="#d2262f">
    <path d="M349.5 50 v-9 q2.5 -6 5 0 v9z"><animate attributeName="opacity" values=".6;1;.7;1;.6" dur="4s" repeatCount="indefinite"/></path>
    <path d="M545.5 50 v-9 q2.5 -6 5 0 v9z"><animate attributeName="opacity" values="1;.6;1;.8;1" dur="5s" repeatCount="indefinite"/></path>
  </g>

  <!-- cemetery gate -->
  <g fill="#000" stroke="#000">
    <rect x="418" y="20" width="10" height="30" stroke="none"/>
    <rect x="472" y="20" width="10" height="30" stroke="none"/>
    <polygon points="417,21 423,8 429,21" stroke="none"/>
    <polygon points="471,21 477,8 483,21" stroke="none"/>
    <path d="M428 30 Q450 10 472 30" fill="none" stroke-width="2"/>
    <path d="M432 50 V30 M438 50 V25 M444 50 V20 M450 50 V18 M456 50 V20 M462 50 V25 M468 50 V30" stroke-width="1.4" fill="none"/>
    <path d="M450 18 l-2.4 -3.5 h4.8z M444 20 l-2 -3 h4z M456 20 l-2 -3 h4z" stroke="none"/>
    <rect x="449" y="3" width="2" height="12" stroke="none"/><rect x="445" y="6" width="10" height="2" stroke="none"/>
  </g>

  <!-- ground -->
  <path d="M0 45 Q150 42 300 45 T600 45 T900 44 V50 H0z" fill="#000"/>

  <!-- tombstones and crosses -->
  <g fill="#000">
    <use href="#stone" x="100" y="48"/>
    <use href="#cross" x="130" y="48"/>
    <use href="#stone" x="160" y="48" transform="translate(-8 0) scale(1.15)"/>
    <use href="#cross" x="270" y="48"/>
    <use href="#stone" x="300" y="48"/>
    <use href="#cross" x="395" y="48" transform="translate(-14 4) scale(.8)"/>
    <use href="#cross" x="590" y="48" transform="translate(130 4) scale(.8)"/>
    <use href="#stone" x="620" y="48"/>
    <use href="#cross" x="650" y="48" transform="translate(-6 0) scale(1.1)"/>
    <use href="#stone" x="690" y="48"/>
    <use href="#cross" x="730" y="48"/>
    <use href="#stone" x="800" y="48"/>
    <use href="#cross" x="830" y="48"/>
    <use href="#stone" x="885" y="48"/>
  </g>

  <!-- fog -->
  <g fill="#c8c8d2" opacity=".14">
    <ellipse cx="200" cy="46" rx="130" ry="4"><animate attributeName="cx" values="150;260;150" dur="16s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="640" cy="47" rx="150" ry="4"><animate attributeName="cx" values="700;580;700" dur="20s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- bats -->
  <g fill="#000" stroke="#8a1520" stroke-width="1.6">
    <g>
      <animateMotion dur="16s" repeatCount="indefinite" path="M-20 24 C200 4 350 30 500 12 S800 6 920 22"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".5s" repeatCount="indefinite"/>
        <g transform="scale(.3) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
    <g>
      <animateMotion dur="22s" begin="-6s" repeatCount="indefinite" path="M920 30 C700 12 500 34 300 18 S60 12 -20 28"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".6s" repeatCount="indefinite"/>
        <g transform="scale(.24) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
    <g>
      <animateMotion dur="28s" begin="-12s" repeatCount="indefinite" path="M-20 12 C250 30 450 4 650 20 S850 8 920 16"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".45s" repeatCount="indefinite"/>
        <g transform="scale(.36) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
    <g>
      <animateMotion dur="19s" begin="-3s" repeatCount="indefinite" path="M920 10 C650 26 420 8 200 22 S40 8 -20 18"/>
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 .5;1 1" dur=".55s" repeatCount="indefinite"/>
        <g transform="scale(.22) translate(-32 -18)"><use href="#bat"/></g></g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
